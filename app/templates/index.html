{% extends 'layout2.html' %}

{% block title %}Inicio - Tech-Dragon{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
{% endblock %}

{% block page_title %}Bienvenido a Tech-Dragon{% endblock %}

{% block content %}

<div class="home-grid">
    <a href="{{ url_for('productos.lista') }}" class="home-card">
        <i class="bi bi-box-seam"></i>
        <span>Productos</span>
    </a>

    <a href="{{ url_for('clientes.lista') }}" class="home-card">
        <i class="bi bi-people-fill"></i>
        <span>Clientes</span>
    </a>

    <a href="{{ url_for('ventas.nueva_venta') }}" class="home-card">
        <i class="bi bi-plus-circle"></i>
        <span>Crear Venta</span>
    </a>

    <a href="{{ url_for('ventas.historial_ventas') }}" class="home-card">
        <i class="bi bi-list"></i>
        <span>Historial Ventas</span>
    </a>
</div>

{% endblock %}
