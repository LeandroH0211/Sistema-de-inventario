
{% extends 'layout.html' %}

{% block title %}Nuevo Producto{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/clientes.css') }}">
{% endblock %}
{% block main_class %}page-centered{% endblock %}
{% block page_title %}NUEVO CLIENTE{% endblock %}

{% block content %}

<form method="POST" action="" class="cliente-form">
    <div class="form-field">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" required>
    </div>

    <div class="form-field">
        <label for="direccion">Direccion</label>
        <input type="text" name="direccion" required>
    </div>

    <div class="form-field">
        <label for="telefono">Telefono</label>
        <input type="number" name="telefono" id="" value="0" required>
    </div>

    <div class="form-field">
        <label for="email">Email</label>
        <input type="email" name="email" required>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-green">Guardar</button>
        <a href="{{ url_for('clientes.lista') }}" class="btn-delete">Cancelar</a>
    </div>
</form>

{% endblock %}
