{% extends 'layout.html' %}

{% block title %}Nuevo Cliente{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/clientes.css') }}">
{% endblock %}

{% block main_class %}page-centered{% endblock %}
{% block page_title %}{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h3>Nuevo Cliente</h3>
        <a href="{{ url_for('clientes.lista') }}" class="close-btn">×</a>
    </div>

    <form method="POST" class="cliente-form">

        <div class="form-field">
            <label>Nombre</label>
            <input type="text" name="nombre" required>
        </div>

        <div class="form-field">
            <label>Dirección</label>
            <input type="text" name="direccion" required>
        </div>

        <div class="form-field">
            <label>Teléfono</label>
            <input type="number" name="telefono" required>
        </div>

        <div class="form-field">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('clientes.lista') }}" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-green">Guardar</button>
        </div>

    </form>

</div>

{% endblock %}
