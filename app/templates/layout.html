<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tech-Dragon{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Tech-Dragon Logo" class="nav-logo">
        <h1>Tech-Dragon</h1>
    </div>

    <nav class="menu">
        <a href="/productos">
            <i class="bi bi-box-seam"></i> Productos
        </a>

        <a href="/clientes">
            <i class="bi bi-people-fill"></i> Clientes
        </a>

        <a href="/ventas/nueva">
            <i class="bi bi-plus-circle"></i> Crear Venta
        </a>

        <a href="/ventas/historial">
            <i class="bi bi-list"></i> Historial Ventas
        </a>
    </nav>
</header>

<main class="{% block main_class %}{% endblock %}">
    <h2>{% block page_title %}{% endblock %}</h2>

    {% block content %}
    {% endblock %}
</main>

</body>
</html>
