<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tech-Dragon{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block extra_css %}{% endblock %}

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="app-container">

    <!-- 🔵 SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/logo.png') }}" class="nav-logo">
            <h2>Tech-Dragon</h2>
        </div>

        <nav class="menu-vertical">
            <a href="/">
               <i class="bi bi-house-door"></i>Inicio
            </a>
            <a href="/productos">
                <i class="bi bi-box-seam"></i> Productos
            </a>

            <a href="/clientes">
                <i class="bi bi-people-fill"></i> Clientes
            </a>

            <a href="/ventas/nueva">
                <i class="bi bi-plus-circle"></i> Crear Venta
            </a>

            <a href="/ventas/historial">
                <i class="bi bi-list"></i> Historial Ventas
            </a>
        </nav>

    </aside>

    <!-- 🟢 CONTENIDO -->
    <main class="main-content {% block main_class %}{% endblock %}">
        <h2>{% block page_title %}{% endblock %}</h2>

        {% block content %}
        {% endblock %}
    </main>

</div>

</body>
</html>
