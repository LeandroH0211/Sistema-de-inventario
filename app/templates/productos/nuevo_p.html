{% extends 'layout.html' %}

{% block title %}Nuevo Producto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/productos.css') }}">
{% endblock %}

{% block main_class %}page-centered{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h3>Nuevo Producto</h3>
        <a href="{{ url_for('productos.lista') }}" class="close-btn">×</a>
    </div>

    <form method="POST" class="producto-form">

        <div class="form-field">
            <label>NOMBRE</label>
            <input type="text" name="nombre" required>
        </div>

        <div class="form-field">
            <label>DESCRIPCIÓN</label>
            <input type="text" name="descripcion" required>
        </div>

        <div class="form-field">
            <label>CATEGORÍA</label>
            <select name="categoria">
                <option>Electrónica</option>
                <option>Muebles</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label>PRECIO (S/)</label>
                <input type="number" step="0.01" name="precio" required>
            </div>

            <div class="form-field">
                <label>STOCK</label>
                <input type="number" name="stock" value="0" required>
            </div>

            <div class="form-field">
                <label>STOCK MÍN.</label>
                <input type="number" name="stock_minimo" value="5" required>
            </div>
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('productos.lista') }}" class="btn-cancelar">
                Cancelar
            </a>

            <button type="submit" class="btn-green">
                Guardar
            </button>
        </div>

    </form>

</div>

{% endblock %}
