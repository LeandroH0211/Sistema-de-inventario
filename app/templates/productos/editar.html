{% extends 'layout.html' %}

{% block title %}Editar Producto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/productos.css') }}">
{% endblock %}

{% block main_class %}page-centered{% endblock %}

{% block page_title %}{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h3>Editar Producto</h3>
        <a href="{{ url_for('productos.lista') }}" class="close-btn">×</a>
    </div>

    <form method="POST" class="producto-form">

        <div class="form-field">
            <label>Nombre</label>
            <input type="text" name="nombre" value="{{ producto.nombre }}" required>
        </div>

        <div class="form-field">
            <label>Descripción</label>
            <input type="text" name="descripcion" value="{{ producto.descripcion }}" required>
        </div>

        <div class="form-field">
            <label>Categoría</label>
            <select name="categoria">
                <option selected>{{ producto.categoria }}</option>
                <option>Electrónica</option>
                <option>Muebles</option>
            </select>
        </div>

        <div class="form-row">

            <div class="form-field">
                <label>Precio</label>
                <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required>
            </div>

            <div class="form-field">
                <label>Stock</label>
                <input type="number" name="stock" value="{{ producto.stock }}" required>
            </div>

            <div class="form-field">
                <label>Stock mínimo</label>
                <input type="number" name="stock_minimo" value="{{ producto.stock_minimo }}" required>
            </div>

        </div>

        <div class="form-actions">
            <a href="{{ url_for('productos.lista') }}" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-green">Guardar</button>
        </div>

    </form>

</div>

{% endblock %}
